</button> <div id="uploadStatus" class="upload-status" data-astro-cid-j7pv25f6></div> </article> <article class="panel control-card" data-astro-cid-j7pv25f6> <div class="meta-row" data-astro-cid-j7pv25f6> <div data-astro-cid-j7pv25f6> <label class="label" data-astro-cid-j7pv25f6>Icons Per Line</label> <div class="stepper" role="group" aria-label="Icons per line control" data-astro-cid-j7pv25f6> <button id="decLine" type="button" aria-label="Decrease icons per line" data-astro-cid-j7pv25f6>-</button> <span id="perLineDisplay" data-astro-cid-j7pv25f6>4</span> <button id="incLine" type="button" aria-label="Increase icons per line" data-astro-cid-j7pv25f6>+</button> </div> </div> <div data-astro-cid-j7pv25f6> <label class="label" data-astro-cid-j7pv25f6>Theme</label> <div class="theme-toggle" data-astro-cid-j7pv25f6> <button class="theme-btn active" data-theme="dark" type="button" data-astro-cid-j7pv25f6>Dark</button> <button class="theme-btn" data-theme="light" type="button" data-astro-cid-j7pv25f6>Light</button> </div> </div> </div> </article> <article class="panel control-card" data-astro-cid-j7pv25f6> <label class="label" for="iconSearch" data-astro-cid-j7pv25f6>Icons Search</label> <input type="text" id="iconSearch" class="search-input" placeholder="Search (react, typescript...)" data-astro-cid-j7pv25f6> <div class="icon-grid" id="iconResults" data-astro-cid-j7pv25f6></div> </article> </div> </section> </main> <script>(function(){const iconNames = ["ableton","activitypub","actix","adonis","aftereffects","aiscript","alpinejs","anaconda","androidstudio","angular","ansible","apollo","apple","appwrite","arch","arduino","astro","atom","audition","autocad","aws","azul","azure","babel","bash","bevy","bitbucket","blender","bootstrap","bsd","bun","c","cassandra","clion","clojure","cloudflare","cmake","codepen","coffeescript","cpp","crystal","cs","css","cypress","d3","dart","debian","deno","devto","discord","discordbots","discordjs","django","docker","dotnet","dynamodb","eclipse","elasticsearch","electron","elixir","elysia","emacs","ember","emotion","expressjs","fastapi","fediverse","figma","firebase","flask","flutter","forth","fortran","gamemakerstudio","gatsby","gcp","gherkin","git","github","githubactions","gitlab","gmail","godot","golang","gradle","grafana","graphql","gtk","gulp","haskell","haxe","haxeflixel","heroku","hibernate","html","htmx","idea","illustrator","instagram","ipfs","java","javascript","jenkins","jest","jquery","julia","kafka","kali","kotlin","ktor","kubernetes","laravel","latex","less","linkedin","linux","lit","lua","markdown","mastodon","materialui","matlab","maven","mint","misskey","mongodb","mysql","neovim","nestjs","netlify","nextjs","nginx","nim","nix","nodejs","notion","npm","nuxtjs","obsidian","ocaml","octave","opencv","openshift","openstack","p5js","perl","photoshop","php","phpstorm","pinia","pkl","plan9","planetscale","pnpm","postgresql","postman","powershell","premiere","prisma","processing","prometheus","pug","pycharm","python","pytorch","qt","r","rabbitmq","rails","raspberrypi","react","reactivex","redhat","redis","redux","regex","remix","replit","rider","robloxstudio","rocket","rollupjs","ros","ruby","rust","sass","scala","scikitlearn","selenium","sentry","sequelize","sketchup","solidity","solidjs","spotify","spring","sqlite","stackoverflow","styledcomponents","sublime","supabase","svelte","svg","swift","symfony","tailwindcss","tauri","tensorflow","terraform","threejs","twitter","typescript","ubuntu","unity","unrealengine","v","vala","vercel","verilog","vim","visualstudio","vite","vitest","vscode","vscodium","vuejs","vuetify","webassembly","webflow","webpack","webstorm","windicss","windows","wordpress","workers","xd","yarn","yew","zig"];

      const ICONS = iconNames
      const WORKER_URL = window.location.origin + "/icons"

      let selectedIcons = ["react"]
      let theme = "dark"
      let perLine = 4
      let customIconsList = []

      const elements = {
        iconSearch: document.getElementById("iconSearch"),
        iconResults: document.getElementById("iconResults"),
        previewFrame: document.getElementById("previewFrame"),
        urlDisplay: document.getElementById("urlDisplay"),
        copyBtn: document.getElementById("copyBtn"),
        copyIcon: document.getElementById("copyIcon"),
        copyText: document.getElementById("copyText"),
        decLine: document.getElementById("decLine"),
        incLine: document.getElementById("incLine"),
        perLineDisplay: document.getElementById("perLineDisplay"),
        uploadBtnLocal: document.getElementById("uploadBtnLocal"),
        customFileInput: document.getElementById("customFile"),
        uploadStatus: document.getElementById("uploadStatus"),
        themeBtns: document.querySelectorAll(".theme-btn"),
      }

      async function handleFileUpload(file) {
        if (file.type !== "image/svg+xml") {
          elements.uploadStatus.textContent = "Only SVG files allowed"
          elements.uploadStatus.style.color = "var(--danger)"
          return
        }

        elements.uploadStatus.textContent = "Uploading..."
        elements.uploadStatus.style.color = "var(--muted)"
        const formData = new FormData()
        formData.append("file", file)

        try {
          const res = await fetch("/custom-icons/upload", {
            method: "POST",
            body: formData,
          })

          if (!res.ok) {
            elements.uploadStatus.textContent = `Upload failed (${res.status})`
            elements.uploadStatus.style.color = "var(--danger)"
            return
          }

          const data = await res.json()
          if (!data.objectPath) {
            elements.uploadStatus.textContent = "Bad upload response"
            elements.uploadStatus.style.color = "var(--danger)"
            return
          }

          customIconsList.push(`custom:${data.objectPath}`)
          elements.uploadStatus.textContent = "Uploaded"
          elements.uploadStatus.style.color = "var(--accent-strong)"
          updatePreview()

          setTimeout(() => {
            if (elements.uploadStatus.textContent === "Uploaded") {
              elements.uploadStatus.textContent = ""
            }
          }, 2400)
        } catch {
          elements.uploadStatus.textContent = "Upload error"
          elements.uploadStatus.style.color = "var(--danger)"
        }
      }

      function buildUrl() {
        let icons = [...selectedIcons, ...customIconsList]
        if (icons.length === 0) icons = ["react"]

        const url = new URL(WORKER_URL)
        url.searchParams.set("i", icons.join(","))
        url.searchParams.set("theme", theme)
        url.searchParams.set("perline", perLine)
        return url.toString()
      }

      function updatePreview() {
        const url = buildUrl()
        elements.urlDisplay.textContent = url
        elements.previewFrame.innerHTML = `<img src="${url}" alt="Icon preview">`
      }

      function renderIconResults() {
        const query = elements.iconSearch.value.toLowerCase()
        const filtered = ICONS.filter((name) => name.includes(query))

        elements.iconResults.innerHTML = filtered
          .map(
            (name) =>
              `<div class="icon-item ${selectedIcons.includes(name) ? "selected" : ""}" data-icon="${name}">${name}</div>`
          )
          .join("")

        document.querySelectorAll(".icon-item").forEach((item) => {
          item.addEventListener("click", (event) => {
            const icon = event.currentTarget.dataset.icon
            if (selectedIcons.includes(icon)) {
              selectedIcons = selectedIcons.filter((value) => value !== icon)
            } else {
              selectedIcons.push(icon)
            }
            renderIconResults()
            updatePreview()
          })
        })
      }

      function updatePerLine(delta) {
        const next = perLine + delta
        if (next >= 1 && next <= 10) {
          perLine = next
          elements.perLineDisplay.textContent = perLine
          updatePreview()
        }
      }

      elements.iconSearch.addEventListener("input", renderIconResults)

      elements.themeBtns.forEach((btn) => {
        btn.addEventListener("click", (event) => {
          elements.themeBtns.forEach((item) => item.classList.remove("active"))
          event.currentTarget.classList.add("active")
          theme = event.currentTarget.dataset.theme
          updatePreview()
        })
      })

      elements.decLine.addEventListener("click", () => updatePerLine(-1))
      elements.incLine.addEventListener("click", () => updatePerLine(1))

      elements.uploadBtnLocal.addEventListener("click", () => {
        elements.customFileInput.click()
      })

      elements.customFileInput.addEventListener("change", (event) => {
        const files = event.target.files
        if (files && files.length > 0) handleFileUpload(files[0])
        event.target.value = ""
      })

      elements.copyBtn.addEventListener("click", () => {
        const url = buildUrl()
        navigator.clipboard.writeText(url).then(() => {
          elements.copyBtn.classList.add("success")
          elements.copyText.textContent = "Copied"
          elements.copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>'

          setTimeout(() => {
            elements.copyBtn.classList.remove("success")
            elements.copyText.textContent = "Copy URL"
            elements.copyIcon.innerHTML =
              '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>'
          }, 2000)
        })
      })

      renderIconResults()
      updatePreview()
    })();</script> </body> </html>
